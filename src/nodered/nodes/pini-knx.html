<script type="text/x-red" data-template-name="pini-knx in">
  <div class="form-row">
    <label for="node-input-address"><i class="fa fa-sitemap"></i> Group Address</label>
    <input type="text" id="node-input-address" placeholder="e.g. 9/0/1">
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Optional label">
  </div>
</script>

<script type="text/x-red" data-help-name="pini-knx in">
  <p>Triggers a flow whenever the bridge receives a KNX group-value write.</p>
  <p>Optionally filter by a single KNX group address. Outputs <code>msg.payload</code>, <code>msg.address</code>, and <code>msg.knx</code>.</p>
</script>

<script type="text/x-red" data-template-name="pini-knx out">
  <div class="form-row">
    <label for="node-input-address"><i class="fa fa-sitemap"></i> Group Address</label>
    <input type="text" id="node-input-address" placeholder="Leave blank to use msg.address">
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Optional label">
  </div>
</script>

<script type="text/x-red" data-help-name="pini-knx out">
  <p>Writes <code>msg.payload</code> to the configured KNX group address.</p>
  <p>If no address is configured, the node uses <code>msg.address</code> or <code>msg.knx.address</code>.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType('pini-knx in', {
    category: 'piniMqtt4KNX',
    color: '#cfe2ff',
    defaults: {
      name: { value: '' },
      address: { value: '' },
    },
    inputs: 0,
    outputs: 1,
    icon: 'font-awesome/fa-sign-in',
    label: function() {
      return this.name || this.address || 'pini-knx in';
    },
  });

  RED.nodes.registerType('pini-knx out', {
    category: 'piniMqtt4KNX',
    color: '#cfe2ff',
    defaults: {
      name: { value: '' },
      address: { value: '' },
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-sign-out',
    align: 'right',
    label: function() {
      return this.name || this.address || 'pini-knx out';
    },
  });
</script>
